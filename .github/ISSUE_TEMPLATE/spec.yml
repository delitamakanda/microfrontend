name: Ticket (spec)
description: Une fonctionnalité ou une correction, décrite pour pouvoir être implémentée par l’agent.
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Un titre seul suffit : ajoute ensuite le label `agent:refine` et l’agent rédigera la spec.
        Si tu remplis les sections ci-dessous toi-même, tu peux directement poser `agent:ready`.
        L’agent travaille sur `storefront/` et `adminpanel/` ; `blog/` est hors de son périmètre.
  - type: dropdown
    id: app
    attributes:
      label: App concernée
      options:
        - storefront
        - adminpanel
        - les deux (contrat de fédération)
  - type: textarea
    id: context
    attributes:
      label: Contexte
      description: Pourquoi ce ticket existe.
  - type: textarea
    id: behaviour
    attributes:
      label: Comportement attendu
  - type: textarea
    id: acceptance
    attributes:
      label: Critères d'acceptation
      description: Un critère observable et testable par ligne.
      value: |
        - [ ]
  - type: textarea
    id: technical
    attributes:
      label: Impact technique
      description: Pages et routes, composants, modules exposés par le storefront (`exposes`) ou importés par l’admin (`storefrontApp/*`), endpoints de l’API merch_store, besoin éventuel côté backend (facultatif).
  - type: textarea
    id: tests
    attributes:
      label: Plan de test
  - type: textarea
    id: out-of-scope
    attributes:
      label: Hors périmètre
